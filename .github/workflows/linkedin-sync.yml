name: LinkedIn Follower Sync

on:
  schedule:
    - cron: "0 8 * * *" # daily 08:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run LinkedIn sync
        run: npm run linkedin:sync

      - name: Commit snapshot if changed
        run: |
          if git diff --quiet -- data/linkedin-follower-count.json; then
            echo "No changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/linkedin-follower-count.json
            git commit -m "chore: update LinkedIn follower count"
            git push
          fi
